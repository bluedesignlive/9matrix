name: Build HelenOS amd64 cross-compiler

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/toolchain.yml'   # only re-runs if workflow changes

jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            texinfo flex bison \
            libgmp-dev libmpfr-dev libmpc-dev \
            gcc make wget python3

      - name: Clone HelenOS source (this has toolchain.sh)
        run: |
          git clone --depth=1 https://github.com/HelenOS/helenos.git /tmp/helenos

      - name: Build amd64 cross-compiler
        run: |
          cd /tmp/helenos/tools
          JOBS=2 ./toolchain.sh amd64

      - name: Package toolchain
        run: |
          tar czf amd64-helenos-cross.tar.gz \
            -C $HOME/.local/share/HelenOS cross/
          ls -lh amd64-helenos-cross.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd64-helenos-cross
          path: amd64-helenos-cross.tar.gz
          retention-days: 30
